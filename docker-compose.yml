services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: checkout
      POSTGRES_PASSWORD: checkout
      POSTGRES_DB: checkout
    # 54329 avoids clashing with other local Postgres instances on 5432/5433.
    ports:
      - "54329:5432"
    # The integration tests create one database per test and run in parallel.
    command: ["postgres", "-c", "max_connections=500"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkout -d checkout"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
